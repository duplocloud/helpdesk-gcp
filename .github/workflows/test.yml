name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [platform, app]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - name: Format
        run: tofu fmt -check -recursive
      - name: Init
        working-directory: ${{ matrix.root }}
        run: tofu init -backend=false -input=false -lockfile=readonly
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: tofu validate
      - name: Test
        working-directory: ${{ matrix.root }}
        run: tofu test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0
      - name: Init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
