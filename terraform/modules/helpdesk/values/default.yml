# Static defaults for GKE Standard. Overridden by the customer file, then Terraform `set` values.
backend:
  persistence:
    enabled: true
  serviceAccount:
    create: true
config:
  cloudProvider: GCP
  mongoDbDatabaseName: duplo-ai-helpdesk
  aiStudioIsMasterDisabled: true
xterm:
  enabled: false
  securityContext:
# Gateway API; ingress.paths still drive the HTTPRoutes.
ingress:
  enabled: false
gateway:
  enabled: true
  className: gke-l7-global-external-managed
  internal:
    enabled: false
mongodb:
  auth:
    rootUser: helpdesk
  useStatefulSet: true
  backup:
    # Use mongodbBackup; both create a duplicate PVC.
    enabled: false
secrets:
  # Set in the override file; empty disables a provider.
  googleClientId: ""
  googleClientSecret: ""
  microsoftClientId: ""
  microsoftClientSecret: ""
  microsoftTenantId: ""
  # Empty: generated by the chart.
  jwtSharedSecret: ""
frontend:
  port: 8080
slackBackend:
  enabled: false
nfs-server:
  enabled: false
duploAgent:
  serviceAccount:
    create: true
  securityContext:
  dind:
    enabled: false
collector:
  enabled: true
internalIngress:
  enabled: false
bedrockSubscription:
  enabled: false
